<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Devenir Vendeur - MAVID</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-4">
<div class="max-w-md mx-auto">
<a href="/" class="text-yellow-400">← Retour</a>
<h1 class="text-3xl font-black mt-4">Devenir Vendeur <span class="text-yellow-400">MAVID</span></h1>
<p class="text-gray-400 mt-2">Vends à Kinshasa, reçois tes clients chaque jour.</p>
<form class="mt-6 space-y-3" onsubmit="alert('Demande envoyée ! Le Boss va te contacter.'); return false;">
<input required placeholder="Ton Nom Complet" class="w-full p-4 rounded-xl bg-zinc-900 outline-none">
<input required placeholder="Numéro WhatsApp ex: +243..." class="w-full p-4 rounded-xl bg-zinc-900 outline-none">
<input required placeholder="Ce que tu vends ex: Perruques" class="w-full p-4 rounded-xl bg-zinc-900 outline-none">
<select class="w-full p-4 rounded-xl bg-zinc-900"><option>Commune - Gombe</option><option>Commune - Bandal</option><option>Commune - Kintambo</option><option>Commune - Lemba</option><option>Commune - Matonge</option><option>Commune - Ngaliema</option></select>
<button class="w-full bg-yellow-400 text-black font-black py-4 rounded-full">ENVOYER MA DEMANDE</button>
</form>
</div>
</body>
</html>
